<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dropingan WL TAP</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#e0364e"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="ui.css">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mu:#5b6b85;--bd:#e3e8f0;--soft:#eef2f8;--ac:#c8102e;--ok:#0f8a52;--wn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f14;--card:#171b25;--tx:#eef1f6;--mu:#98a2b6;--bd:#283041;--soft:#1f2533;--ok:#4cd38f;--wn:#f0b445}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 80px}
.w{max-width:820px;margin:0 auto}h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 5px;border-top:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;border-top:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wn{color:var(--wn);font-size:12.5px;margin:4px 0}.tw{overflow-x:auto}.mono{font:12px ui-monospace,Menlo,monospace}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}.kpi div{background:var(--soft);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--mu)}.kpi b{display:block;font-size:19px;color:var(--tx)}
</style></head><body><div class="w">
<h1>Dropingan WL · Bagan Siapi-api</h1><div class="sub" id="sub"></div>
<div class="tabs" id="tp"></div><div id="o"></div>
<div class="sub">Pembanding ke ST belum ada (butuh raw ST BAA). Untuk TAP lain, tambahkan lewat <span class="mono">tools/wl_tap.py</span>.</div>
</div>
<script src="wl-tap.js"></script>
<script>
const nf=v=>Math.round(v).toLocaleString('id-ID'),es=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T='BAA',W=WLT[T];let P='VF';
const MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],fd=s=>{const[y,m,d]=s.split('-');return +d+' '+MN[+m-1]};
function wr(R){const w=[];const S=[...R].sort((a,b)=>a[3].length-b[3].length||(a[3]<b[3]?-1:1));
 for(let i=1;i<S.length;i++){const x=S[i-1],y=S[i];if(x[3].length===y[3].length&&BigInt(y[3])<=BigInt(x[4]))w.push(`SN tumpang tindih: ${x[3]}–${x[4]} (${x[1]}, ${fd(x[0])}) dan ${y[3]}–${y[4]} (${y[1]}, ${fd(y[0])})`)}
 R.forEach(r=>{if(/VF 7GB (52|57)H/.test(r[2]))w.push(`Denom meragukan "${r[2]}": ${r[1]} ${r[3]}–${r[4]} (${nf(r[5])} pcs, ${fd(r[0])})`)});return w}
function draw(){const R=W[P],sfs=[...new Set(R.map(r=>r[1]))],pk=[...new Set(R.map(r=>r[2]))].sort(),tot=R.reduce((a,r)=>a+r[5],0);
 const M={};R.forEach(r=>{(M[r[1]]=M[r[1]]||{})[r[2]]=(M[r[1]][r[2]]||0)+r[5]});
 const dd={};R.forEach(r=>dd[r[0]]=(dd[r[0]]||0)+r[5]);const ds=Object.keys(dd).sort();
 const w=wr(R);
 document.getElementById('o').innerHTML=`<div class="kpi"><div>Total di-drop<b>${nf(tot)}</b></div><div>Baris SN<b>${R.length}</b></div><div>Tanggal terakhir<b>${fd(ds[ds.length-1])}</b></div></div>
 <div class="card"><h2>Per SF × paket</h2><div class="tw"><table><tr><th>SF</th>${pk.map(p=>`<th>${es(p)}</th>`).join('')}<th>Total</th></tr>${sfs.map(s=>`<tr><td>${es(s)}</td>${pk.map(p=>`<td>${M[s][p]?nf(M[s][p]):'–'}</td>`).join('')}<td><b>${nf(Object.values(M[s]).reduce((a,b)=>a+b,0))}</b></td></tr>`).join('')}
 <tr><td><b>Total</b></td>${pk.map(p=>`<td><b>${nf(sfs.reduce((a,s)=>a+(M[s][p]||0),0))}</b></td>`).join('')}<td><b>${nf(tot)}</b></td></tr></table></div></div>
 <div class="card"><h2>Per tanggal drop</h2><div class="tw"><table><tr><th>Tanggal</th><th>Pcs</th></tr>${ds.map(d=>`<tr><td>${fd(d)}</td><td>${nf(dd[d])}</td></tr>`).join('')}</table></div></div>
 ${w.length?`<div class="card"><h2>⚠️ Perlu dicek (${w.length})</h2>${w.map(x=>`<div class="wn">${es(x)}</div>`).join('')}</div>`:''}`}
document.getElementById('sub').textContent='Data SN STOCK SF Nov 2026 · sampai '+fd(W.upd);
document.getElementById('tp').innerHTML=['VF','SA'].map(k=>`<button data-k="${k}" class="${k===P?'on':''}">${k==='VF'?'VF (Reguler & ByU)':'SA'}</button>`).join('');
document.getElementById('tp').onclick=e=>{const b=e.target.closest('button');if(!b)return;P=b.dataset.k;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));draw()};draw();
</script><script src="nav.js"></script></body></html>
