<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard TAP Bagan Batu</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b3a6e">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--ink:#14213d;--mute:#5b6b85;--acc:#0b3a6e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#18212f;--ink:#e8edf6;--mute:#9aa8bf;--acc:#6ea8ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:24px 16px;padding-top:max(24px,env(safe-area-inset-top))}
h1{font-size:22px;margin:8px 0 4px}
p.sub{margin:0 0 20px;color:var(--mute);font-size:14px}
.grid{display:grid;gap:14px;max-width:560px;margin:0 auto}
a.card{display:block;background:var(--card);border-radius:16px;padding:18px 18px 16px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:5px solid var(--acc)}
a.card:active{transform:scale(.99)}
.card b{display:block;font-size:17px;margin-bottom:4px;color:var(--ink)}
.card span{font-size:13px;color:var(--mute);line-height:1.45}
</style></head>
<body>
<div class="grid">
  <h1>Dashboard TAP Bagan Batu</h1>
  <p class="sub">Pilih dashboard yang mau dibuka.</p>
  <a class="card" href="digipos.html"><b>Dashboard DIGIPOS</b><span>Performa VF / SA (Perdana), ringkasan, SF, kecamatan, klik misi, outlet, dan temuan.</span></a>
  <a class="card" href="penjualan.html"><b>Dashboard Penjualan</b><span>Performa penjualan PV / SA / NGRS, kunjungan, tren bulanan, petugas, dan stok.</span></a>
</div>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script>
</body></html>
