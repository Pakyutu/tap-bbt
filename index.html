<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAP Bagan Batu</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--bg2:#151924;--card:rgba(255,255,255,.055);--bd:rgba(255,255,255,.09);--ink:#f2f4f8;--mute:#98a2b6;--red:#e3132f;--red2:#ff4d63;--blue:#5b8cff;--ok:#2fd27a;--warn:#ffb020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
  padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
body:before{content:"";position:fixed;inset:-30% -40% auto;height:80vh;z-index:-1;
  background:radial-gradient(closest-side,rgba(227,19,47,.38),transparent 70%),radial-gradient(closest-side at 80% 60%,rgba(91,140,255,.22),transparent 70%);
  filter:blur(10px);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(8%,6%,0) scale(1.08)}}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font:600 13px "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.brand img{width:30px;height:30px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--bd);font:500 12px "IBM Plex Mono",monospace;color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(47,210,122,.6);animation:pulse 2s infinite}
.off .dot{background:var(--warn);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(47,210,122,0)}100%{box-shadow:0 0 0 0 rgba(47,210,122,0)}}
.hello{font:700 clamp(28px,8vw,40px)/1.05 Archivo,sans-serif;margin:0 0 8px;letter-spacing:-.02em}
.hello span{background:linear-gradient(90deg,var(--red2),#ff9a5a);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{display:flex;align-items:baseline;gap:10px;color:var(--mute);font-size:14px;margin-bottom:26px}
.clock b{font:500 22px "IBM Plex Mono",monospace;color:var(--ink);letter-spacing:.02em}
.cards{display:grid;gap:14px}
a.card{position:relative;display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;
  opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .15s}
a.card:nth-child(2){animation-delay:.08s}
a.card:active{transform:scale(.98)}
@keyframes rise{to{opacity:1;transform:none}}
a.card:after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--c1),transparent 45%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ic{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 8px 22px -8px var(--c1)}
.ic svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1;min-width:0}
.tx b{display:block;font:600 18px Archivo,sans-serif;margin-bottom:3px}
.tx span{display:block;font-size:13px;color:var(--mute);line-height:1.4}
.tx small{display:block;margin-top:7px;font:500 11px "IBM Plex Mono",monospace;color:var(--mute);opacity:.85}
.arr{flex:none;color:var(--mute);font-size:20px}
.dg{--c1:#e3132f;--c2:#ff7a45}
.pj{--c1:#3b6dff;--c2:#7a5cff}
.install{display:none;width:100%;margin-top:18px;padding:14px;border-radius:16px;border:1px dashed rgba(255,255,255,.22);background:transparent;color:var(--ink);font:600 14px "IBM Plex Sans",sans-serif;cursor:pointer}
.install.show{display:block}
.foot{margin-top:26px;text-align:center;font:400 11px "IBM Plex Mono",monospace;color:var(--mute);opacity:.6}
/* splash */
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;transition:opacity .45s,visibility .45s}
#splash.hide{opacity:0;visibility:hidden}
.bars{display:flex;gap:7px;align-items:flex-end;height:56px}
.bars i{width:12px;border-radius:4px;background:linear-gradient(var(--red2),var(--red));animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bars i:nth-child(1){height:40%}.bars i:nth-child(2){height:70%;animation-delay:.08s}.bars i:nth-child(3){height:100%;animation-delay:.16s}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
#splash p{margin:16px 0 0;font:600 12px "IBM Plex Mono",monospace;letter-spacing:.2em;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}a.card{opacity:1;transform:none}}
</style></head>
<body>
<div id="splash"><div><div class="bars"><i></i><i></i><i></i></div><p>TAP BAGAN BATU</p></div></div>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="icon-192.png" alt="">TAP BBT</div>
    <div class="chip" id="net"><span class="dot"></span><span id="netx">Online</span></div>
  </div>
  <h1 class="hello"><span id="greet">Halo</span>,<br>siap pantau hari ini?</h1>
  <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
  <div class="cards">
    <a class="card dg" href="digipos.html">
      <div class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 7h6M9 11h6M9 15h3"/></svg></div>
      <div class="tx"><b>DIGIPOS</b><span>VF / SA Perdana · SF · Kecamatan · Klik Misi · Outlet</span><small id="u-digipos">Memuat…</small></div>
      <div class="arr">›</div>
    </a>
    <a class="card pj" href="penjualan.html">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 16V11M11 16V6M16 16v-3M20 16V8"/></svg></div>
      <div class="tx"><b>Penjualan</b><span>PV / SA / NGRS · Kunjungan · Tren · Petugas · Stok</span><small id="u-penjualan">Memuat…</small></div>
      <div class="arr">›</div>
    </a>
  </div>
  <button class="install" id="inst">＋ Pasang aplikasi di layar utama</button>
  <div class="foot">TAP Bagan Batu · v3</div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  // splash: sekali per sesi
  var seen=false;try{seen=sessionStorage.getItem("bbt_splash")==="1";sessionStorage.setItem("bbt_splash","1")}catch(e){}
  setTimeout(function(){$("splash").classList.add("hide")},seen?0:900);
  // sapaan + jam
  function tick(){
    var d=new Date(),h=d.getHours();
    $("greet").textContent=h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam";
    $("time").textContent=d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}).replace(".",":");
    $("date").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  }
  tick();setInterval(tick,15000);
  // status jaringan
  function net(){var on=navigator.onLine;$("net").classList.toggle("off",!on);$("netx").textContent=on?"Online":"Offline"}
  addEventListener("online",net);addEventListener("offline",net);net();
  // waktu data terakhir diperbarui
  function rel(t){var m=Math.round((Date.now()-t)/60000);if(m<1)return"baru saja";if(m<60)return m+" menit lalu";var h=Math.round(m/60);if(h<24)return h+" jam lalu";return Math.round(h/24)+" hari lalu"}
  ["digipos","penjualan"].forEach(function(n){
    fetch(n+".html",{method:"HEAD",cache:"no-store"}).then(function(r){
      var lm=r.headers.get("last-modified");if(!lm)throw 0;var t=new Date(lm);
      $("u-"+n).textContent="Diperbarui "+rel(t)+" · "+t.toLocaleDateString("id-ID",{day:"numeric",month:"short"})+" "+t.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
    }).catch(function(){$("u-"+n).textContent=navigator.onLine?"Siap dibuka":"Mode offline · data tersimpan"});
  });
  // tombol pasang
  var dp=null;
  addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;$("inst").classList.add("show")});
  $("inst").onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.finally(function(){dp=null;$("inst").classList.remove("show")})};
  addEventListener("appinstalled",function(){$("inst").classList.remove("show")});
  // getar halus saat ketuk kartu
  document.querySelectorAll("a.card").forEach(function(a){a.addEventListener("click",function(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}})});
  if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")});
})();
</script>
</body></html>
