name: Pengingat update data
on:
  schedule: [{cron: '30 0 * * *'}]   # 07:30 WIB
  workflow_dispatch:
permissions: {contents: read}
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tgbot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_REMIND: '1'
