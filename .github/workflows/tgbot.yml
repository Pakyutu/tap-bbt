name: Bot update data
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
concurrency: tgbot
permissions: {contents: write}
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q openpyxl
      - run: python3 tools/tgbot.py
        env: {TG_TOKEN: '${{ secrets.TG_TOKEN }}', TG_CHAT: '${{ secrets.TG_CHAT }}'}
      - run: |
          git config user.name "tap-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -qm "Update data via bot" && git push)
