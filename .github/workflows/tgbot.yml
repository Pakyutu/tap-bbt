name: Bot update data
on:
  workflow_dispatch:
  repository_dispatch: {types: [tg]}
permissions: {contents: write}
concurrency: {group: tgbot, cancel-in-progress: false}
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache/restore@v4
        with: {path: .inbox, key: inbox-none, restore-keys: 'inbox-'}
      - run: pip install -q openpyxl gdown
      - run: python3 tools/tgbot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_UPDATE: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.update) || '' }}
          TG_ACK: ${{ github.event.client_payload.ack }}
      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'repository_dispatch' && hashFiles('.inbox/**') != ''
        with: {path: .inbox, key: 'inbox-${{ github.run_id }}'}
      - run: |
          git config user.name "tap-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Update data via bot"
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 5; done
