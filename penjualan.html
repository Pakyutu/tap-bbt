/* ===== Tampilan: "papan kendali lapangan" — pita navy di atas, isi terang berbingkai tipis, angka tegas ===== */
:root{
  --bg:#f3f5f8;--card:#ffffff;--tx:#121a2b;--mu:#5d6779;--bd:#dde2ea;--soft:#eef1f6;
  --accent:#1f3c88;--accent2:#7fa2ff;--up:#15803d;--dn:#c02626;--warn:#b45309;--ac:#1f3c88;
  --bar:#2a3550;--bar2:#1f3c88;
  --band:#101a33;--band2:#1a2747;--band-bd:#2c3b62;--band-fg:#eef2fb;--band-mu:#9aa8c7;
  --f-disp:"Archivo","Arial Narrow",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1220;--card:#151c2e;--tx:#e7ebf4;--mu:#97a1b6;--bd:#26304a;--soft:#1c2539;--accent:#8fb0ff;--accent2:#8fb0ff;--up:#4ade80;--dn:#f87171;--warn:#fbbf24;--ac:#8fb0ff;--bar:#aab5cf;--bar2:#8fb0ff;--band:#0a0f1c;--band2:#141c30;--band-bd:#28324d;--band-fg:#eef2fb;--band-mu:#8d98b3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1220;--card:#151c2e;--tx:#e7ebf4;--mu:#97a1b6;--bd:#26304a;--soft:#1c2539;--accent:#8fb0ff;--accent2:#8fb0ff;--up:#4ade80;--dn:#f87171;--warn:#fbbf24;--ac:#8fb0ff;--bar:#aab5cf;--bar2:#8fb0ff;--band:#0a0f1c;--band2:#141c30;--band-bd:#28324d;--band-fg:#eef2fb;--band-mu:#8d98b3;color-scheme:dark}
body{font-family:var(--f-body);background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.w{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:-.01em;text-wrap:balance}
h1::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent2);margin-right:9px;vertical-align:2px}
.top{background:var(--band);color:var(--band-fg);border-bottom:0;top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.top .sub,.top .lbl,.top .mu{color:var(--band-mu)!important}
.top select,.top .btn{background:var(--band2);color:var(--band-fg);border-color:var(--band-bd)}
.top select option{background:var(--card);color:var(--tx)}
.top .seg{background:var(--band2);border-color:var(--band-bd)}
.top .seg button{color:var(--band-mu)}
.top .seg button.on{background:var(--band-fg);color:var(--band)}
.top .btn:hover,.top select:hover{border-color:var(--band-mu)}
.tabs{margin-top:12px;gap:4px}
.tabs button{color:var(--band-mu);font-weight:500;border-bottom:3px solid transparent;padding:9px 12px 8px}
.tabs button:hover{color:var(--band-fg)}
.tabs button.on{color:var(--band-fg);border-bottom-color:var(--accent2);font-weight:600}
#fchips .chip{background:var(--band2);color:var(--band-fg)}
.panel{padding-top:18px}
.kpi{gap:12px}
.k{border-radius:8px;padding:12px 14px;border-color:var(--bd)}
.k .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--mu)}
.k .v{font-family:var(--f-disp);font-size:27px;font-weight:700;letter-spacing:-.015em;margin:4px 0 2px}
.card{border-radius:8px;border-color:var(--bd)}
.card h3{font-family:var(--f-disp);font-size:15px;font-weight:650;letter-spacing:-.005em}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
td{border-bottom-color:var(--soft)}
tr.tot td{border-top:1.5px solid var(--bd);background:var(--soft)}
.fz1,#otab tr>.fz3{font-family:var(--f-mono);font-size:11.5px;color:var(--mu)}
.tag{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);font-weight:600;border-radius:4px}
.note{border-radius:6px;background:color-mix(in srgb,var(--accent) 6%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 18%,var(--bd));border-left:3px solid var(--accent)}
.al{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px 6px 10px;font-weight:500}
.al::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mu);flex:none}
.al.dn::before{background:var(--dn)}
.al.dn{background:color-mix(in srgb,var(--dn) 7%,var(--card));border-color:color-mix(in srgb,var(--dn) 35%,var(--bd));color:var(--tx)}
.btn{border-radius:7px}
.btn:focus-visible,select:focus-visible,.seg button:focus-visible,.tabs button:focus-visible,input:focus-visible,.al:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
input[type=search],#p-kunj select{background:var(--card);color:var(--tx)}
.mini div{background:var(--bar)}.mini div.nv{background:var(--accent)}
#wamodal .mbox{border:1px solid var(--bd)}
#wacopy{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #wacopy{color:#0d1220!important}}
:root[data-theme="dark"] #wacopy{color:#0d1220!important}
@media(max-width:700px){h1{font-size:16px}.k .v{font-size:21px}.tabs{margin-top:8px}.al{font-size:12px;padding:5px 10px 5px 9px}.kpi .k:last-child:nth-child(odd){grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Nuansa merah-putih operator: pita merah, aksen merah, netral abu dingin ===== */
:root{--bg:#f4f4f6;--card:#ffffff;--tx:#1a1416;--mu:#6b6266;--bd:#e4dfe1;--soft:#f3eff0;
  --accent:#d0102b;--accent2:#ffffff;--ac:#d0102b;--bar:#3b3437;--bar2:#d0102b;--up:#15803d;--dn:#c8102e;--warn:#b45309;
  --band:#d0102b;--band2:#b30c24;--band-bd:#e8566a;--band-fg:#ffffff;--band-mu:#ffd3d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121012;--card:#1c181a;--tx:#f1ecee;--mu:#a59ca0;--bd:#33292d;--soft:#241d20;--accent:#ff4d63;--accent2:#ffffff;--ac:#ff4d63;--bar:#b9b0b4;--bar2:#ff4d63;--up:#4ade80;--dn:#ff6b7d;--warn:#fbbf24;--band:#8e0a1d;--band2:#6f0716;--band-bd:#b8384a;--band-fg:#ffffff;--band-mu:#f5c2ca;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121012;--card:#1c181a;--tx:#f1ecee;--mu:#a59ca0;--bd:#33292d;--soft:#241d20;--accent:#ff4d63;--accent2:#ffffff;--ac:#ff4d63;--bar:#b9b0b4;--bar2:#ff4d63;--up:#4ade80;--dn:#ff6b7d;--warn:#fbbf24;--band:#8e0a1d;--band2:#6f0716;--band-bd:#b8384a;--band-fg:#ffffff;--band-mu:#f5c2ca;color-scheme:dark}
.top{background:linear-gradient(100deg,var(--band) 0%,var(--band) 55%,var(--band2) 100%)}
.top .seg button.on{background:#fff;color:var(--band)}
.top select,.top .btn,.top .seg{background:rgba(0,0,0,.16);border-color:rgba(255,255,255,.28)}

/* ikon sinyal di depan judul */
h1::before{width:14px;height:13px;border-radius:0;vertical-align:0;margin-right:10px;
  background:linear-gradient(#fff,#fff) 0 100%/3px 40% no-repeat,linear-gradient(#fff,#fff) 5px 100%/3px 70% no-repeat,linear-gradient(#fff,#fff) 10px 100%/3px 100% no-repeat}
.tabs button.on{border-bottom-color:#fff}

/* tab dibekukan: pita atas ikut ter-scroll, baris tab menempel */
.top{position:relative!important;top:auto!important;box-shadow:none;z-index:7}
.top>.w{padding-bottom:10px!important}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--band2);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tabbar .tabs{margin-top:0;padding-top:2px}
.tabbar .tabs button{padding:10px 12px 9px}
#app.cap .tabbar{display:none!important}

/* fitur wow */
.gsearch{position:relative;flex:1;min-width:180px;max-width:280px}
.gsearch input{width:100%;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.28);color:var(--band-fg);border-radius:7px;padding:6px 10px 6px 30px;font:inherit;font-size:13px}
.gsearch input::placeholder{color:var(--band-mu)}
.gsearch::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;margin-top:-7px;border:2px solid var(--band-mu);border-radius:50%}
.gsearch::after{content:"";position:absolute;left:20px;top:50%;width:5px;height:2px;margin-top:3px;background:var(--band-mu);transform:rotate(45deg)}
#gres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:30;max-height:60vh;overflow:auto;padding:4px;min-width:260px}
#gres button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;color:var(--tx);text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;font:inherit}
#gres button:hover,#gres button:focus-visible{background:var(--soft)}
#gres small{color:var(--mu);font-size:11.5px}
.health{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:0;margin-bottom:12px}
.hg{display:flex;align-items:center;gap:12px}
.k-t{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--mu)}
.hst{font-family:var(--f-disp);font-size:24px;font-weight:700}.hst.up{color:var(--up)}.hst.warn{color:var(--warn)}.hst.dn{color:var(--dn)}
.gnum{font-family:var(--f-disp);font-size:24px;font-weight:700;fill:var(--tx)}
.hparts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px}
.hpl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);gap:8px}.hpl b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.hbar{height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}.hbar i{display:block;height:100%;border-radius:3px}
@media(max-width:700px){.health{grid-template-columns:1fr}}
.bdg{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;margin-left:5px;white-space:nowrap;vertical-align:1px}
.b-dn{background:color-mix(in srgb,var(--dn) 13%,transparent);color:var(--dn)}
.b-w{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.b-up{background:color-mix(in srgb,var(--up) 13%,transparent);color:var(--up)}
.spk{vertical-align:middle}
@keyframes drawln{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.drawln{stroke-dasharray:1;animation:drawln 1s ease-out both}
@keyframes gz{from{stroke-dashoffset:var(--c)}}
.gz{animation:gz .9s ease-out both}
@media (prefers-reduced-motion:reduce){.drawln,.gz{animation:none}}
#app.cap .gsearch,#app.cap #fsbtn{display:none!important}
.tabbar>.w{padding-top:0!important;padding-bottom:0!important}
.tag{white-space:nowrap;display:inline-block}
@media(max-width:700px){.gsearch{order:10;flex-basis:100%;max-width:none}}

.prio{margin-top:12px}
.plist{list-style:none;margin:10px 0 6px;padding:0;display:grid;gap:8px;counter-reset:p}
.plist li{counter-increment:p;display:grid;grid-template-columns:28px 1fr auto;grid-template-areas:"n a s" "n b s";gap:2px 10px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.plist li::before{content:counter(p);grid-area:n;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.pnm{grid-area:a;min-width:0}.pwhy{grid-area:b;display:flex;flex-wrap:wrap;gap:4px}
.pw{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--mu)}
.psc{grid-area:s;font-family:var(--f-disp);font-weight:700;font-size:20px;color:var(--accent)}
.fz-id{font-family:var(--f-mono);font-size:11px}
.an{padding:8px 0;border-top:1px solid var(--soft)}.an:first-of-type{border-top:0}
.an-h{display:flex;gap:8px;align-items:center}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-size:11.5px;font-weight:700;text-align:center;font-family:var(--f-body)}
.al-l{cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:2px}
.al-l:hover{color:var(--accent)}

function prio(list){ // list = kjRows() hasil untuk SF & hari terpilih

  return list.filter(r=>r.full>0||r.pvO>0).map(r=>{const why=[];let s=0;
    if(r.x.kat==='Top 20'){s+=35;why.push('Top 20')}

    else if(r.pvN<r.pvO){const k=Math.min(1,(r.pvO-r.pvN)/Math.max(r.pvO,1));s+=12*k;why.push(`turun ${sgn(r.pvN-r.pvO)} vs Okt`)}
    s+=20*Math.log10(1+r.full)/Math.log10(1+mx);why.push(`Okt ${f(r.full)}`);
    if(!r.last&&r.full>0){s+=8}else if(r.last&&DC-r.last>=4){s+=5;why.push(`order terakhir ${r.last} Nov`)}
    return Object.assign({},r,{score:Math.round(s),why})}).sort((a,b)=>b.score-a.score);
}

function anomalies(){
  if(NG())return null;const k=S.prod==='PV'?'pv':'sa';const ids=new Set(rows().map(r=>r.id));const O=D.O.filter(x=>ids.has(x.id));
  const med=a=>{const v=a.filter(x=>x>0).sort((p,q)=>p-q);return v.length?v[Math.floor(v.length/2)]:0};
  const spike=[],koreksi=[],stop=[],baru=[];const thr=S.prod==='PV'?1000:50,thr2=S.prod==='PV'?300:20;
  O.forEach(x=>{const a=x[k],m=a.slice(0,10),n=cv(a,NVi(DC)),o=cv(a,OKi(DC));
    const base=med(m.slice(0,8));[8,9].forEach(i=>{if(m[i]>=thr&&base>0&&m[i]>=3*base){const after=i===8?m[9]:n*30/DC;if(after<0.4*m[i])spike.push({x,i,v:m[i],base,after})}});
    for(let k=1;k<CP.length;k++){const d=CP[k],dv=cv(a,NVi(d))-cv(a,NVi(CP[k-1]));if(dv<0)koreksi.push({x,d,dv})}
    const rut=[6,8,9].every(i=>m[i]>0)&&(m[6]+m[8]+m[9])/3>=thr2;if(rut&&n===0&&DC>=5)stop.push({x,avg:Math.round((m[6]+m[8]+m[9])/3),o});
    if(m.slice(0,8).every(v=>v===0)&&(m[8]+m[9]+n)>=thr)baru.push({x,v:m[8]+m[9]+n});
  });
  const nn=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'').replace(/(cell|celluler|celuler|cellular|ponsel|phone)/g,'');
  const byKey={};O.forEach(x=>{const key=x.sf+'|'+nn(x.nm);if(nn(x.nm).length>=3)(byKey[key]=byKey[key]||[]).push(x)});
  const dobel=Object.values(byKey).filter(g=>g.length>1);
  spike.sort((a,b)=>b.v-a.v);stop.sort((a,b)=>b.avg-a.avg);baru.sort((a,b)=>b.v-a.v);

}

function toast(m){const e=$('shotmsg');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
async function capture(type){
  const app=$('app');const fl=[S.kec,S.sf,S.kat,S.pjp].filter(Boolean);
  const now=new Date();const ts=now.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  $('capinfo').textContent=`Tab: ${TABN[S.tab]}${fl.length?' · Filter: '+fl.join(', '):''}${S.tab==='out'&&S.q?' · Cari: '+S.q:''}${S.tab==='out'&&S.st!=='all'?' · '+$('st').selectedOptions[0].text:''} · Dibuat ${ts}`;
  app.classList.add('cap');app.style.width='';
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  let extra=0;app.querySelectorAll('.panel.on .tw table').forEach(tb=>{const c=tb.closest('.tw');extra=Math.max(extra,tb.scrollWidth-c.clientWidth+2)});
  if(extra>0){app.style.width=(app.offsetWidth+extra)+'px';await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))}
  const bg=getComputedStyle(document.body).backgroundColor;
  const opt={pixelRatio:2,skipFonts:true,backgroundColor:bg,width:app.scrollWidth,height:app.scrollHeight,style:{margin:'0'}};
  try{ if(type==='png')return await htmlToImage.toBlob(app,opt);
       const url=await htmlToImage.toJpeg(app,Object.assign({quality:.95},opt));return await (await fetch(url)).blob();
  }finally{app.classList.remove('cap');app.style.width=''}
}
const fname=()=>`TAP-BBT_${S.prod}_${TABN[S.tab].replace(/ /g,'-')}_${new Date().toISOString().slice(0,10)}.jpg`;
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(x=>{DL=x}).catch(()=>{})}catch(e){}
async function saveFile(b){
  if(DL){try{await DL.save({filename:fname(),data:b});toast('Gambar disimpan.')}catch(e){toast(e&&e.code==='declined'?'Dibatalkan':'Tidak bisa menyimpan di sini.')}return}
  const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=fname();document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Gambar diunduh.');
}
async function shot(a){
  $('shotmenu').classList.remove('open');toast('Membuat gambar…');
  try{
    if(a==='copy'){
      if(!(navigator.clipboard&&window.ClipboardItem))throw new Error('Browser ini tidak bisa menyalin gambar. Pakai "Unduh JPG".');
      const b=await capture('png');
      try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Gambar tersalin. Tempel (paste) di WhatsApp.')}
      catch(e){toast('Salin tidak diizinkan di sini. Pakai "Unduh JPG".')}
      return}
    const b=await capture('jpg');
    if(a==='share'){const file=new File([b],fname(),{type:'image/jpeg'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:'Dashboard TAP BBT'});return}
        catch(e){if(e&&e.name==='AbortError'){toast('Dibatalkan');return}}}
      toast('Bagikan langsung tidak bisa di sini, gambar disimpan dulu.');}
    await saveFile(b);
  }catch(e){toast(e&&e.message?e.message:'Gagal membuat gambar')}
}
