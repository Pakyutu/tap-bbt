<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Penyusun WL</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0f14"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mu:#5b6b85;--bd:#e3e8f0;--soft:#eef2f8;--ac:#c8102e;--ok:#0f8a52}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f14;--card:#171b25;--tx:#eef1f6;--mu:#98a2b6;--bd:#283041;--soft:#1f2533;--ok:#4cd38f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 60px}
.w{max-width:760px;margin:0 auto}h1{font-size:22px;margin:6px 60px 4px 0}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 6px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:10px}
@media (max-width:520px){.g3{grid-template-columns:1fr 1fr}.g3 .full{grid-column:1/-1}}
.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:15px;cursor:pointer}.btn.s{background:var(--soft);color:var(--tx);border:1px solid var(--bd);font-size:13px;padding:7px 12px}.btn.d{background:transparent;color:var(--ac);border:1px solid var(--bd);font-size:13px;padding:6px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.err{color:var(--ac);font-weight:600;margin-top:8px;min-height:1em}
.sr{display:grid;grid-template-columns:1fr 1fr 36px;gap:6px;align-items:end;margin-top:8px}.sr input{font-size:13.5px;padding:9px 7px;letter-spacing:-.2px}.sr .n{grid-column:1/-1;font-size:11.5px;color:var(--mu);margin-top:-2px}.sr .n:empty{display:none}.sr .x{border:1px solid var(--bd);background:transparent;color:var(--ac);border-radius:8px;padding:8px 10px;cursor:pointer}.sr label{margin:0 0 3px}.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.qk button{border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.pc{display:flex;flex-wrap:wrap;gap:6px}.pc button{border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer}.pc button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.pc button small{opacity:.75;margin-left:4px}.pr{display:grid;grid-template-columns:1.6fr 1fr auto;gap:6px;margin-top:6px;align-items:center}.pr input{font-size:13.5px;padding:8px 9px}.pr .x{border:1px solid var(--bd);background:transparent;color:var(--ac);border-radius:8px;padding:7px 10px;cursor:pointer}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.stk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}.stk div{background:var(--soft);border-radius:10px;padding:8px 10px}.stk small{display:block;color:var(--mu);font-size:11.5px}.stk b{font-size:17px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ac)}
.al{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:10px}.al .h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.al .h b{font-size:15px}.al .rg{font-size:13px;margin-top:3px}.al .m{color:var(--mu);font-size:13px}.al .sm{font-weight:700}
.ed{display:none;margin-top:8px}.al.e .ed{display:block}.al.e .vw{display:none}
details summary{cursor:pointer;color:var(--mu);font-size:13px;margin-top:6px}.list{column-width:150px;column-gap:16px;font-size:13px;margin-top:6px}
.tot{position:sticky;bottom:0;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.tot b{font-size:18px}.tot small{color:var(--mu);display:block;font-size:11.5px}
</style></head><body><div class="w">
<h1>Penyusun WL</h1><div class="sub">Isi rentang SN (bisa lebih dari satu), lalu bagi ke outlet satu per satu dengan jumlah & harga bebas. SN otomatis berurutan. Semua bisa diedit.</div>

<div class="card"><h2>1. Stok SN</h2>
  <div id="rows"></div>
  <div class="row" style="margin-top:8px"><button class="btn s" id="addr">＋ Tambah rentang SN</button></div>
  <div id="segi" style="color:var(--mu);font-size:12.5px;margin-top:6px"></div>
  <label style="display:flex;justify-content:space-between;align-items:center">Produk <a href="#" id="pm" style="color:var(--ac);font-size:12.5px;text-decoration:none">✏️ Kelola produk</a></label>
  <div class="pc" id="pc"></div>
  <div id="pe" style="display:none;margin-top:8px;border:1px dashed var(--bd);border-radius:10px;padding:10px">
    <div id="pel"></div>
    <div class="pr" style="margin-top:8px"><input id="pn" placeholder="Nama produk baru, mis. VF 7GB/3 hari"><input id="ph" inputmode="numeric" placeholder="Harga (opsional)"><button class="btn s" id="pa">＋ Tambah</button></div>
    <div style="font-size:11.5px;color:var(--mu);margin-top:6px">Harga produk otomatis terisi ke kolom harga outlet saat produk dipilih (tetap bisa diubah).</div>
  </div>
  <div class="stk" id="stk"></div><div class="bar"><i id="bar" style="width:0"></i></div>
</div>

<div class="card"><h2 id="h2">2. Outlet ke-1</h2>
  <div class="g3"><div class="full"><label>Nama outlet / SF</label><input id="on" placeholder="mis. Toko A"></div>
  <div><label>Jumlah (pcs)</label><input id="oq" type="number" min="1" inputmode="numeric" placeholder="50"><div class="qk" id="qk"><button>10</button><button>20</button><button>25</button><button>50</button><button>100</button></div></div>
  <div><label>Harga per pcs (Rp)</label><input id="oh" type="text" inputmode="numeric" placeholder="mis. 16.500"></div></div>
  <div class="m" id="prev" style="margin-top:8px;color:var(--mu);font-size:13px"></div>
  <div class="row"><button class="btn" id="add">Submit outlet</button><button class="btn s" id="all">Pakai semua sisa</button></div>
  <div class="err" id="er"></div>
</div>

<div id="list"></div>
<div class="card" id="hist"></div>
<div class="tot" id="tot" style="display:none"></div>
</div>
<script>
const $=i=>document.getElementById(i);
const clean=v=>String(v||'').replace(/\D/g,''),rp=v=>'Rp '+Math.round(v).toLocaleString('id-ID'),nf=v=>Math.round(v).toLocaleString('id-ID'),num=v=>parseInt(clean(v)||'0',10);
let S={st:'',p:'',al:[]},ed=-1;
try{const s=JSON.parse(localStorage.getItem('wl2')||'null');if(s){S=s;if(S.st===undefined)S.st=(S['a']&&S['b'])?S['a']+' - '+S['b']:''}}catch(e){}
const P0=['VF 7GB/24 jam','VF 7GB/2 hari','VF 7GB/3 hari','VF 7GB/5 hari','VF 11GB/5 hari','VF 7GB/7 hari','SA 3GB','SA 5GB','SA 7GB','SA 10GB','SA 15GB','SA BYU 3GB','SA BYU 5GB'].map(n=>({n,h:0}));
let PL;try{PL=JSON.parse(localStorage.getItem('wlp')||'null')}catch(e){}if(!Array.isArray(PL))PL=P0;
const saveP=()=>{try{localStorage.setItem('wlp',JSON.stringify(PL))}catch(e){}};
function drawC(){$('pc').innerHTML=PL.map((p,i)=>`<button data-pi="${i}" class="${p.n===S.p?'on':''}">${p.n.replace(/</g,'&lt;')}${p.h?`<small>${nf(p.h)}</small>`:''}</button>`).join('')||'<span style="color:var(--mu);font-size:13px">Belum ada produk. Ketuk ✏️ Kelola produk untuk menambah.</span>'}
function drawP(){drawC();$('pel').innerHTML=PL.map((p,i)=>`<div class="pr" data-pe="${i}"><input data-f="n" value="${p.n.replace(/"/g,'&quot;')}"><input data-f="h" inputmode="numeric" value="${p.h?nf(p.h):''}" placeholder="Harga"><button class="x">✕</button></div>`).join('')}
drawP();
$('pm').addEventListener('click',e=>{e.preventDefault();const o=$('pe').style.display==='none';$('pe').style.display=o?'block':'none';$('pm').textContent=o?'✓ Selesai':'✏️ Kelola produk'});
$('pc').addEventListener('click',e=>{const b=e.target.closest('[data-pi]');if(!b)return;const p=PL[+b.dataset.pi];S.p=S.p===p.n?'':p.n;if(S.p&&p.h)$('oh').value=nf(p.h);drawC();render()});
$('pel').addEventListener('input',e=>{const w=e.target.closest('[data-pe]');if(!w)return;const p=PL[+w.dataset.pe],f=e.target.dataset.f;if(f==='n'){const was=p.n===S.p;p.n=e.target.value.trim();if(was)S.p=p.n}else p.h=num(e.target.value);saveP();drawC();render()});
$('pel').addEventListener('click',e=>{const x=e.target.closest('.x');if(!x)return;const i=+x.closest('[data-pe]').dataset.pe;if(PL[i].n===S.p)S.p='';PL.splice(i,1);saveP();drawP();render()});
$('pa').addEventListener('click',()=>{const n=$('pn').value.trim();if(!n){$('pn').focus();return}if(!PL.some(p=>p.n===n))PL.push({n,h:num($('ph').value)});S.p=n;if(num($('ph').value))$('oh').value=nf(num($('ph').value));$('pn').value='';$('ph').value='';saveP();drawP();render()});
let RW=String(S.st||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(l=>{const p=l.split(/[^0-9]+/).filter(Boolean);return[p[0]||'',p[1]||'']});if(!RW.length)RW=[['','']];
const syncSt=()=>{S.st=RW.filter(r=>clean(r[0])).map(r=>clean(r[1])?clean(r[0])+' - '+clean(r[1]):clean(r[0])).join('\n')};
function cnt(r){const a=clean(r[0]),b=clean(r[1]);if(!a)return'';if(!b)return'1 SN';if(a.length!==b.length)return'<span style="color:var(--ac)">cek</span>';const n=BigInt(b)-BigInt(a);return n<0n?'<span style="color:var(--ac)">cek</span>':nf(Number(n)+1)+' SN'}
function drawRows(){$('rows').innerHTML=RW.map((r,i)=>`<div class="sr" data-i="${i}"><div>${i?'':'<label>SN awal</label>'}<input class="mono" inputmode="numeric" data-k="0" value="${r[0]}" placeholder="600089897777"></div><div>${i?'':'<label>SN akhir (opsional)</label>'}<input class="mono" inputmode="numeric" data-k="1" value="${r[1]}" placeholder="600089897876"></div><button class="x" title="Hapus">✕</button><div class="n">${cnt(r)}</div></div>`).join('')}
drawRows();
$('rows').addEventListener('input',e=>{const t=e.target,w=t.closest('.sr');if(!w)return;RW[+w.dataset.i][+t.dataset.k]=t.value;w.querySelector('.n').innerHTML=cnt(RW[+w.dataset.i]);syncSt();render()});
$('rows').addEventListener('click',e=>{const x=e.target.closest('.x');if(!x)return;const i=+x.closest('.sr').dataset.i;RW.splice(i,1);if(!RW.length)RW=[['','']];drawRows();syncSt();render()});
$('addr').addEventListener('click',()=>{RW.push(['','']);drawRows();const ins=$('rows').querySelectorAll('.sr:last-child input');ins[0].focus()});
$('qk').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;e.preventDefault();$('oq').value=e.target.textContent;render()});
const save=()=>{try{localStorage.setItem('wl2',JSON.stringify(S))}catch(e){}};
let ERR='';
function rng(){ERR='';const seg=[];const lines=String(S.st||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);let L=0;
  for(const ln of lines){const p=ln.split(/[^0-9]+/).filter(Boolean);if(!p.length)continue;const a=p[0],b=p[1]||p[0];
    if(a.length!==b.length){ERR=`Baris "${ln}": panjang SN awal & akhir beda.`;continue}
    let A=BigInt(a),B=BigInt(b);if(B<A){const t=A;A=B;B=t}if(B-A>200000n){ERR=`Baris "${ln}": rentang terlalu besar.`;continue}L=Math.max(L,a.length);seg.push({A,B,n:Number(B-A)+1,L:a.length})}
  for(let i=0;i<seg.length;i++)for(let j=i+1;j<seg.length;j++){if(seg[i].A<=seg[j].B&&seg[j].A<=seg[i].B)ERR='Ada rentang yang tumpang tindih / SN dobel. Cek lagi.'}
  if(!seg.length)return null;return{seg,L,tot:seg.reduce((s,x)=>s+x.n,0)}}
function take(r,off,q){const out=[];let o=off,left=q;for(const g of r.seg){if(left<=0)break;if(o>=g.n){o-=g.n;continue}const st=g.A+BigInt(o),k=Math.min(g.n-o,left),en=st+BigInt(k)-1n;out.push([st,en,g.L]);left-=k;o=0}return{parts:out,short:left}}
const fmtP=(parts,L)=>parts.map(([a,b,l])=>a===b?pad(a,l||L):pad(a,l||L)+' – '+pad(b,l||L)).join(', ');
function nextSN(r,off){const t=take(r,off,1);return t.parts.length?pad(t.parts[0][0],t.parts[0][2]||r.L):'-'}
const pad=(x,L)=>x.toString().padStart(L,'0');
function alloc(){const r=rng();if(!r)return[];let off=0;return S.al.map(x=>{const q=Math.max(0,x.q|0),t=take(r,off,q);off+=q;return{...x,parts:t.parts,L:r.L,rg:fmtP(t.parts,r.L),over:t.short>0}})}
function used(){return S.al.reduce((s,x)=>s+(x.q|0),0)}
function render(){
  const r=rng(),u=used(),A=alloc(),sisa=r?r.tot-u:0;
  $('segi').innerHTML=(r?`${r.seg.length} rentang: ${r.seg.slice(0,8).map(g=>nf(g.n)).join(' + ')}${r.seg.length>8?' + …':''} = <b>${nf(r.tot)}</b> SN`:'')+(ERR?` <b style="color:var(--ac)">${ERR}</b>`:'');
  if(r){$('stk').innerHTML=`<div><small>Total SN</small><b>${nf(r.tot)}</b></div><div><small>Terpakai</small><b>${nf(u)}</b></div><div><small>Sisa</small><b style="color:${sisa<0?'var(--ac)':'var(--ok)'}">${nf(sisa)}</b></div><div><small>SN berikutnya</small><b class="mono" style="font-size:14px">${sisa>0?nextSN(r,u):'-'}</b></div>`;$('bar').style.width=Math.min(100,u/r.tot*100)+'%'}
  else{$('stk').innerHTML='';$('bar').style.width='0'}
  $('h2').textContent=`2. Outlet ke-${S.al.length+1}`;
  const q=num($('oq').value);$('prev').innerHTML=r&&q>0?`SN: <span class="mono">${fmtP(take(r,u,Math.min(q,Math.max(0,sisa))).parts,r.L)||'-'}</span>${q>sisa?' <b style="color:var(--ac)">(melebihi sisa '+nf(sisa)+')</b>':''}${num($('oh').value)?' · Subtotal <b>'+rp(q*num($('oh').value))+'</b>':''}`:'';
  $('list').innerHTML=A.length?`<div class="card"><h2>3. Daftar WL (${A.length} outlet)</h2><div class="row" style="margin-top:4px"><button class="btn s" id="csv">⬇️ Unduh Excel (CSV)</button><button class="btn s" id="cr">Salin ringkasan</button><button class="btn s" id="cs">Salin semua SN</button><button class="btn s" id="hsv">💾 Simpan ke riwayat</button><button class="btn s" id="nw">＋ WL baru</button><button class="btn d" id="rs">Hapus semua</button></div>
    ${A.map((x,i)=>`<div class="al${i===ed?' e':''}"><div class="vw"><div class="h"><b>${i+1}. ${x.n||'(tanpa nama)'}</b><span><button class="btn s" data-e="${i}">Edit</button> <button class="btn d" data-x="${i}">Hapus</button></span></div>
      <div class="rg mono">${x.rg}${x.over?' <b style="color:var(--ac)">· melebihi stok</b>':''}</div>
      <div class="m">${nf(x.q)} pcs × ${rp(x.h||0)} = <span class="sm">${rp((x.q|0)*(x.h||0))}</span></div>
      <div style="margin-top:6px"><button class="btn s" data-r="${i}">Salin ringkasan</button> <button class="btn s" data-c="${i}">Salin rincian SN</button> <button class="btn s" data-bq="${i}">▦ Barcode SN</button></div><details><summary>Lihat SN</summary><div class="list mono">${list(x).map((s,j)=>`<div>${j+1}. ${s}</div>`).join('')}</div></details></div>
      <div class="ed"><div class="g3"><div class="full"><label>Nama</label><input data-f="n" value="${(x.n||'').replace(/"/g,'&quot;')}"></div><div><label>Jumlah</label><input data-f="q" type="number" value="${x.q}"></div><div><label>Harga/pcs</label><input data-f="h" inputmode="numeric" value="${x.h?nf(x.h):''}"></div></div>
      <div class="row"><button class="btn" data-sv="${i}">Simpan</button><button class="btn s" data-cn>Batal</button></div><div class="m" style="margin-top:6px">Ubah jumlah akan menggeser SN outlet sesudahnya.</div></div></div>`).join('')}</div>`:'';
  const tq=u,tn=S.al.reduce((s,x)=>s+(x.q|0)*(x.h||0),0);
  $('tot').style.display=A.length?'flex':'none';$('tot').innerHTML=`<div><small>Total pcs</small><b>${nf(tq)}</b></div><div><small>Total nominal</small><b>${rp(tn)}</b></div><div><small>Sisa SN</small><b style="color:${sisa<0?'var(--ac)':'var(--ok)'}">${nf(sisa)}</b></div>`;
  save()}
function snTxt(x,i,h){return (h?`*WL ${S.p||''}*\n`:'')+`${i+1}. ${x.n||'-'}: ${x.rg} (${nf(x.q)} pcs × ${rp(x.h||0)} = ${rp(x.q*(x.h||0))})\n`+list(x).map((s,j)=>`   ${j+1}. ${s}`).join('\n')}
function list(x){const out=[];for(const [a,b,l] of x.parts)for(let c=a;c<=b;c++)out.push(pad(c,l||x.L));return out}
async function copy(t,btn){try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}if(btn){const o=btn.textContent;btn.textContent='Tersalin ✓';setTimeout(()=>btn.textContent=o,1500)}}

['oq','oh'].forEach(i=>$(i).addEventListener('input',render));
$('oh').addEventListener('blur',()=>{const v=num($('oh').value);$('oh').value=v?nf(v):''});
function add(q){$('er').textContent='';const r=rng();if(!r){$('er').textContent='Isi daftar SN stok dulu.';return}
  const sisa=r.tot-used();if(!(q>0)){$('er').textContent='Isi jumlah pcs.';return}if(q>sisa){$('er').textContent=`Jumlah ${nf(q)} melebihi sisa SN (${nf(sisa)}).`;return}
  S.al.push({n:$('on').value.trim(),q,h:num($('oh').value)});$('on').value='';$('oq').value='';render();$('on').focus()}
document.addEventListener('click',e=>{const t=e.target,d=t.dataset;
  if(t.id==='add')add(num($('oq').value));
  if(t.id==='all'){const r=rng();if(r){$('oq').value=r.tot-used();add(r.tot-used())}}
  if(d.e!==undefined){ed=+d.e;render()}
  if(d.cn!==undefined){ed=-1;render()}
  if(d.x!==undefined&&confirm('Hapus outlet ini? SN outlet sesudahnya akan bergeser.')){S.al.splice(+d.x,1);ed=-1;render()}
  if(d.sv!==undefined){const box=t.closest('.al'),g=f=>box.querySelector(`[data-f="${f}"]`).value;const i=+d.sv;const r=rng();const q=num(g('q'));
    const other=used()-(S.al[i].q|0);if(r&&q+other>r.tot){alert(`Jumlah melebihi stok. Maksimal ${nf(r.tot-other)} pcs.`);return}
    S.al[i]={n:g('n').trim(),q,h:num(g('h'))};ed=-1;render()}
  if(d.c!==undefined){e.preventDefault();const A=alloc(),i=+d.c;copy(list(A[i]).map((s,j)=>`${j+1}. ${s}`).join('\n'),t)}
  if(d.r!==undefined){e.preventDefault();const A=alloc(),i=+d.r,x=A[i];copy(`*WL ${S.p||''}*\n${i+1}. ${x.n||'-'}: ${x.rg} (${nf(x.q)} pcs × ${rp(x.h||0)} = ${rp(x.q*(x.h||0))})`,t)}
  if(t.id==='cs'){const A=alloc();copy(`*WL ${S.p||''}*\n\n`+A.map((x,i)=>snTxt(x,i,false)).join('\n\n')+`\n\nTotal: ${nf(used())} pcs · ${rp(S.al.reduce((s,x)=>s+x.q*(x.h||0),0))}`,t)}
  if(t.id==='rs'&&confirm('Hapus semua daftar outlet?')){S.al=[];ed=-1;render()}
  if(t.id==='cr'){const A=alloc();copy(`*WL ${S.p||''}*\n`+A.map((x,i)=>`${i+1}. ${x.n||'-'}: ${x.rg} (${nf(x.q)} pcs × ${rp(x.h||0)} = ${rp(x.q*(x.h||0))})`).join('\n')+`\n\nTotal: ${nf(used())} pcs · ${rp(S.al.reduce((s,x)=>s+x.q*(x.h||0),0))}`,t)}
  if(t.id==='csv'){const rows=[['No','Outlet','SN','Produk','Harga']];let n=1;alloc().forEach(x=>list(x).forEach(s=>rows.push([n++,x.n,{t:s},S.p,x.h||0])));
    rows.push([]);rows.push(['','TOTAL',used()+' pcs','',S.al.reduce((s,x)=>s+x.q*(x.h||0),0)]);
    const csv='﻿'+rows.map(r=>r.map(v=>v&&v.t?`="${v.t}"`:`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`WL_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove()}});
['on','oq','oh'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')add(num($('oq').value))}));
let HQ='',HL;try{HL=JSON.parse(localStorage.getItem('wlh')||'[]')}catch(e){HL=[]}if(!Array.isArray(HL))HL=[];
const saveH=()=>{try{localStorage.setItem('wlh',JSON.stringify(HL))}catch(e){alert('Penyimpanan HP penuh, hapus beberapa riwayat.')}};
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function withS(x,fn){const o=S;S=x;try{return fn()}finally{S=o}}
const tglF=t=>{const d=new Date(t);return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})+' '+d.toTimeString().slice(0,5)};
function loadRW(){RW=String(S.st||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(l=>{const p=l.split(/[^0-9]+/).filter(Boolean);return[p[0]||'',p[1]||'']});if(!RW.length)RW=[['','']];drawRows()}
function drawH(){const q=HQ.trim(),qd=q.replace(/\D/g,''),isSN=qd.length>=6&&qd===q.replace(/\s/g,'');let body='';
  if(!HL.length)body='<div style="color:var(--mu);font-size:13px">Belum ada riwayat. Setelah WL selesai, ketuk <b>💾 Simpan ke riwayat</b>.</div>';
  else if(isSN){const hits=[];HL.forEach(h=>withS(h,()=>{alloc().forEach(x=>{for(const [a,b,l] of x.parts){const L=l||x.L;
      if(qd.length<L){for(let c=a;c<=b;c++){const sn=pad(c,L);if(sn.endsWith(qd))hits.push({h,x,sn})}}else{const A=BigInt(qd);if(A>=a&&A<=b)hits.push({h,x,sn:pad(A,L)})}}})}));
    body=hits.length?hits.slice(0,30).map(r=>`<div class="al"><div class="h"><b>${esc(r.x.n||'-')}</b><span class="m">${tglF(r.h.t)}</span></div><div class="rg mono">${r.sn}</div><div class="m">${esc(r.h.p||'-')} · ${rp(r.x.h||0)}/pcs</div></div>`).join(''):'<div style="color:var(--mu);font-size:13px">SN tidak ditemukan di riwayat.</div>'}
  else{const k=q.toLowerCase();const H=HL.filter(h=>!k||(h.p||'').toLowerCase().includes(k)||h.al.some(a=>(a.n||'').toLowerCase().includes(k)));
    body=H.length?H.map(h=>{const pcs=h.al.reduce((s,x)=>s+(x.q|0),0),tot=h.al.reduce((s,x)=>s+x.q*(x.h||0),0);
      return `<div class="al"${S.hid===h.id?' style="border-color:var(--ac)"':''}><div class="h"><b>${tglF(h.t)}</b><span class="m">${esc(h.p||'-')}</span></div><div class="m">${h.al.length} outlet · ${nf(pcs)} pcs · <span class="sm">${rp(tot)}</span>${S.hid===h.id?' · <b style="color:var(--ac)">sedang dibuka</b>':''}</div><div class="m" style="font-size:12px;margin-top:2px">${esc(h.al.map(a=>a.n||'-').join(', ').slice(0,160))}</div><div class="row" style="margin-top:6px"><button class="btn s" data-ho="${h.id}">Buka</button><button class="btn d" data-hx="${h.id}">Hapus</button></div></div>`}).join(''):'<div style="color:var(--mu);font-size:13px">Tidak ada yang cocok.</div>'}
  $('hist').innerHTML=`<h2>Riwayat WL (${HL.length})</h2><input id="hq" placeholder="Cari SN (boleh 6 digit terakhir), outlet, atau produk" value="${esc(HQ)}"><div id="hb">${body}</div>`;}
document.addEventListener('input',e=>{if(e.target.id==='hq'){HQ=e.target.value;drawH();const i=$('hq');i.focus();i.setSelectionRange(HQ.length,HQ.length)}});
document.addEventListener('click',e=>{const t=e.target,d=t.dataset;
  if(t.id==='hsv'){if(!S.al.length){alert('Belum ada outlet.');return}const it={id:S.hid||Date.now().toString(36),t:Date.now(),p:S.p,st:S.st,al:JSON.parse(JSON.stringify(S.al))};
    const i=HL.findIndex(h=>h.id===it.id);if(i>=0)HL[i]=it;else HL.unshift(it);S.hid=it.id;saveH();save();drawH();t.textContent='Tersimpan ✓';setTimeout(()=>{const b=$('hsv');if(b)b.textContent='💾 Simpan ke riwayat'},1500)}
  if(t.id==='nw'){if(S.al.length&&!HL.some(h=>h.id===S.hid)&&!confirm('WL sekarang belum disimpan ke riwayat. Tetap mulai baru?'))return;S={st:'',p:S.p,al:[]};loadRW();drawC();render();drawH();window.scrollTo({top:0,behavior:'smooth'})}
  if(d.ho){const h=HL.find(x=>x.id===d.ho);if(!h)return;if(S.al.length&&S.hid!==h.id&&!confirm('Ganti WL yang sedang dikerjakan dengan riwayat ini?'))return;
    S={st:h.st,p:h.p,al:JSON.parse(JSON.stringify(h.al)),hid:h.id};loadRW();drawC();render();drawH();window.scrollTo({top:0,behavior:'smooth'})}
  if(d.hx&&confirm('Hapus riwayat ini?')){HL=HL.filter(h=>h.id!==d.hx);if(S.hid===d.hx)delete S.hid;saveH();save();drawH()}});
// ---- Barcode SN awal & akhir per outlet ----
const BQ=document.createElement('div');BQ.style.cssText='position:fixed;inset:0;z-index:9999;background:#fff;color:#000;display:none;overflow:auto;padding:calc(64px + env(safe-area-inset-top,0px)) 16px 30px;text-align:center';document.body.appendChild(BQ);
let BF='fisik';try{BF=localStorage.getItem('wlbf')||'fisik'}catch(e){}
function saPS(){let o={pre:'S236x',suf:'00000823'};try{const x=JSON.parse(localStorage.getItem('so_sa1')||'null');if(x){if(x.pre!==undefined)o.pre=x.pre;if(x.suf!==undefined)o.suf=x.suf}}catch(e){}return o}
function codeOf(sn){if(BF==='sn')return{t:'bc',v:sn};if(sn.length===12)return{t:'qr',v:'https://tsel.id/cekvoucher?sn='+sn};if(sn.length===16){const p=saPS();return{t:'bc',v:p.pre+sn+p.suf}}return{t:'bc',v:sn}}
function codeHTML(sn,lab){const c=codeOf(sn);return `<div style="margin:0 auto 22px;max-width:520px"><div style="font:700 13px system-ui;color:#c8102e;letter-spacing:.08em">${lab}</div>
  <div style="margin:8px auto 6px;${c.t==='qr'?'width:min(62vw,250px)':'width:100%'}">${c.t==='qr'?QR.svg(c.v,'100%'):bcSvg(c.v,110)}</div>
  <div style="font:700 20px ui-monospace,monospace;letter-spacing:1px">${sn}</div>${c.v!==sn?`<div style="font-size:11px;color:#777;word-break:break-all">${esc(c.v)}</div>`:''}</div>`}
let BI=-1;
function showBQ(i){BI=i;const x=alloc()[i];if(!x)return;
  const btn='border:1px solid #bbb;background:#e8e8e8;color:#000;font-weight:700;border-radius:10px;padding:9px 14px;font-size:15px';
  BQ.innerHTML=`<div style="position:fixed;left:0;right:0;top:0;background:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;z-index:2">
     <button data-bqx style="${btn}">✕ Tutup</button>
     <span style="display:flex;gap:6px"><button data-bqn="-1" style="${btn}">‹</button><button data-bqn="1" style="${btn}">›</button></span></div>
   <div style="font:700 20px system-ui">${i+1}. ${esc(x.n||'(tanpa nama)')}</div>
   <div style="font-size:13px;color:#555;margin:2px 0 6px">${esc(S.p||'')}${S.p?' · ':''}${nf(x.q)} pcs</div>
   <div style="display:inline-flex;border:1px solid #ccc;border-radius:10px;overflow:hidden;margin-bottom:18px">${[['fisik','Seperti fisik'],['sn','Angka SN saja']].map(([k,t])=>`<button data-bqf="${k}" style="border:0;padding:7px 12px;font-size:13px;font-weight:700;background:${BF===k?'#c8102e':'#fff'};color:${BF===k?'#fff':'#000'}">${t}</button>`).join('')}</div>
   ${x.parts.map(([a,b,l],k)=>{const L=l||x.L,A=pad(a,L),B=pad(b,L),n=Number(b-a)+1;return `${x.parts.length>1?`<div style="font:600 13px system-ui;color:#555;margin:4px 0 10px;border-top:1px dashed #ccc;padding-top:12px">Rentang ${k+1} · ${nf(n)} pcs</div>`:''}${a===b?codeHTML(A,'SN (1 pcs)'):codeHTML(A,'SN AWAL')+codeHTML(B,'SN AKHIR')}`}).join('')}`;
  BQ.style.display='block';BQ.scrollTop=0;try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>BQ._w=w).catch(()=>{})}catch(_){}}
BQ.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.bqx!==undefined){BQ.style.display='none';try{BQ._w&&BQ._w.release()}catch(_){}return}
  if(d.bqf){BF=d.bqf;try{localStorage.setItem('wlbf',BF)}catch(_){}showBQ(BI);return}
  if(d.bqn){const n=alloc().length,j=BI+(+d.bqn);if(j>=0&&j<n)showBQ(j)}});
document.addEventListener('click',e=>{const t=e.target;if(t.dataset&&t.dataset.bq!==undefined)showBQ(+t.dataset.bq)});
render();drawH();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
