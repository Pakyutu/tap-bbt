<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cek WL vs ST</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0f14"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mu:#5b6b85;--bd:#e3e8f0;--soft:#eef2f8;--ac:#c8102e;--ok:#0f8a52;--wn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f14;--card:#171b25;--tx:#eef1f6;--mu:#98a2b6;--bd:#283041;--soft:#1f2533;--ok:#4cd38f;--wn:#f0b445}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 60px}
.w{max-width:820px;margin:0 auto}h1{font-size:22px;margin:6px 60px 4px 0}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 8px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px;font-family:inherit}
textarea{font:13px ui-monospace,Menlo,monospace;min-height:90px}
.btn{padding:10px 15px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer}.btn.s{background:var(--soft);color:var(--tx);border:1px solid var(--bd);font-size:13px;padding:7px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd);font-size:13.5px;cursor:pointer}.ck:first-child{border-top:0}.ck input{width:18px;height:18px;margin-top:2px;flex:none}.ck small{display:block;color:var(--mu);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tabs button{border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:18px;text-align:center;color:var(--mu);font-size:13.5px;cursor:pointer}.drop.on{border-color:var(--ac);color:var(--ac)}
.map{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}.map select{padding:7px 8px;font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.kpi div{background:var(--soft);border-radius:10px;padding:9px 11px}.kpi small{display:block;color:var(--mu);font-size:11.5px}.kpi b{font-size:19px}
.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.ol{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:10px}.ol .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.ol .h b{font-size:15px}.ol .m{color:var(--mu);font-size:12.5px;margin-top:3px}
.pc{font-weight:700;font-size:15px;white-space:nowrap}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;margin:4px 4px 0 0}.tag.w{background:rgba(183,121,31,.15);color:var(--wn)}
details summary{cursor:pointer;color:var(--mu);font-size:12.5px;margin-top:6px}
.err{color:var(--ac);font-size:13px;font-weight:600;margin-top:6px}.ok{color:var(--ok)}
.pk{margin-top:6px;font-size:13px}.pk b{font-weight:600}.rg{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--mu);margin-top:2px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mu);font-size:11.5px;font-weight:600}td:first-child,th:first-child{text-align:left}
</style></head><body><div class="w">
<h1>Cek WL vs ST</h1><div class="sub" id="sub"></div>
<div class="tabs" id="pt"></div>
<div id="res"></div>
</div>
<script src="cekst-data.js"></script>
<script>
const $=i=>document.getElementById(i),nf=v=>Math.round(v).toLocaleString('id-ID'),pc=(a,b)=>b?Math.round(a/b*100):0,esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=p=>p>=90?'var(--ok)':p>=75?'var(--wn)':'var(--ac)',tg=d=>{const x=new Date(d+'T00:00:00');return x.getDate()+' '+['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][x.getMonth()]};
const ft=x=>x?tg(x.slice(0,10))+' '+x.slice(11,16):'-';
const rg=r=>r.replace('-',' – ');
async function copy(t,btn){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}if(btn){const o=btn.textContent;btn.textContent='Tersalin ✓';setTimeout(()=>btn.textContent=o,1500)}}
const BL=['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGU','AGS','SEP','OKT','NOV','DES'],mi=k=>{const m=k.split(' ')[1]||'';const i=BL.indexOf(m);return i<0?99:(m==='AGS'?7:i>7?i-1:i)};
const GK=Object.keys(CK.G||{}).sort((a,b)=>mi(a)-mi(b)||(a.split(' ')[0]>b.split(' ')[0]?-1:a.split(' ')[0]<b.split(' ')[0]?1:0));let P=GK[0]||'VF NOV',F='all';
$('pt').innerHTML=GK.map(k=>`<button data-p="${k}" class="${k===P?'on':''}">${k}</button>`).join('');
const cut=()=>P.startsWith('VF')?CK.cutVF:CK.cutSA;
function draw(){const C=CK.G[P];
  $('sub').innerHTML=`WL dropingan vs transaksi ST Digipos per SN (raw ST Agustus s/d ${tg(CK.cutVF||CK.cutSA)}). ${CK.ft?`<br>📄 File WL: <b>${ft(CK.ft.wl)}</b> · raw ST PV: <b>${ft(CK.ft.pv)}</b> · raw ST SA: <b>${ft(CK.ft.sa)}</b> (WIB)`:''}`;
  if(!C){$('res').innerHTML='<div class="card">Belum ada data.</div>';return}
  const S=C.sf,T=S.reduce((a,o)=>a+o.d,0),Y=S.reduce((a,o)=>a+o.s,0);
  let V=S;if(F==='bl')V=S.filter(o=>o.s<o.d);
  $('res').innerHTML=`<div class="card"><div class="kpi"><div><small>SN didrop</small><b>${nf(T)}</b></div><div><small>Sudah ST</small><b class="ok">${nf(Y)}</b></div><div><small>Belum ST</small><b style="color:var(--ac)">${nf(T-Y)}</b></div><div><small>% ST</small><b style="color:${col(pc(Y,T))}">${pc(Y,T)}%</b></div></div>
    <div class="bar"><i style="width:${pc(Y,T)}%;background:${col(pc(Y,T))}"></i></div><div class="sub" style="margin-top:8px">ST dihitung s/d ${tg(cut())} (data tanggal terakhir bisa belum lengkap).${C.mon&&C.mon.length?' ST per bulan: '+C.mon.map(([m,v])=>['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][+m.slice(5)-1]+' '+nf(v)).join(' · ')+'.':''}${C.lain&&C.lain.length?' <b style="color:var(--wn)">ST di TAP lain: '+C.lain.map(([t,v])=>esc(t)+' '+nf(v)).join(', ')+'</b>.':''}</div>
    <div class="row"><button class="btn" id="cpr">Salin rekap</button><button class="btn s" id="cpb">Salin SN belum ST</button></div></div>
    <div class="card"><h2>Per SF</h2><div class="tabs">${[['all','Semua ('+S.length+')'],['bl','Belum lengkap ('+S.filter(o=>o.s<o.d).length+')']].map(([k,t])=>`<button data-f="${k}" class="${F===k?'on':''}">${t}</button>`).join('')}</div>
    ${V.map(o=>{const p=pc(o.s,o.d);return `<div class="ol"><div class="h"><b>${esc(o.n)}</b><span class="pc" style="color:${col(p)}">${nf(o.s)}/${nf(o.d)} · ${p}%</span></div><div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div>
      ${o.p.map(x=>`<div class="pk"><b>${esc(x.p)}</b>: ${nf(x.s)}/${nf(x.d)} ST${x.b.length?` · <span style="color:var(--ac)">belum ${nf(x.d-x.s)}</span><details><summary>${x.b.length} rentang belum ST</summary><div class="rg">${x.b.map(rg).join('<br>')}</div></details>`:' ✓'}</div>`).join('')}</div>`}).join('')}</div>
    ${C.tgl.length?`<div class="card"><h2>Per tanggal drop</h2><table><tr><th>Tanggal</th><th>Drop</th><th>Sudah ST</th><th>%</th></tr>${C.tgl.map(([d,a,b])=>`<tr><td>${tg(d)}</td><td>${nf(a)}</td><td>${nf(b)}</td><td style="color:${col(pc(b,a))};font-weight:700">${pc(b,a)}%</td></tr>`).join('')}</table></div>`:''}`}
function rekap(){const C=CK.G[P],S=C.sf,T=S.reduce((a,o)=>a+o.d,0),Y=S.reduce((a,o)=>a+o.s,0);
  return `*Cek WL ${P} vs ST Digipos*\nST s/d ${tg(cut())}: ${nf(Y)}/${nf(T)} (${pc(Y,T)}%) · belum ${nf(T-Y)}\n\n`+S.map((o,i)=>`${i+1}. ${o.n}: ${nf(o.s)}/${nf(o.d)} (${pc(o.s,o.d)}%)`).join('\n')}
function belum(){const C=CK.G[P],B=C.sf.filter(o=>o.s<o.d);
  return `*SN ${P} belum ST* (s/d ${tg(cut())})\n\n`+B.map((o,i)=>`${i+1}. ${o.n} (${nf(o.d-o.s)} pcs)\n\n`+o.p.filter(x=>x.b.length).map(x=>`${x.p} (${nf(x.d-x.s)} pcs)\n${x.b.map(rg).join('\n')}`).join('\n\n')).join('\n\n\n')+`\n\nTotal belum ST: ${nf(B.reduce((a,o)=>a+o.d-o.s,0))} pcs`}
document.addEventListener('click',e=>{const t=e.target,d=t.dataset||{};
  if(d.p){P=d.p;document.querySelectorAll('#pt button').forEach(b=>b.classList.toggle('on',b.dataset.p===P));draw()}
  if(d.f){F=d.f;draw()}
  if(t.id==='cpr')copy(rekap(),t);if(t.id==='cpb')copy(belum(),t)});
draw();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script><script src="nav.js"></script></body></html>
