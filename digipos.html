    return `<details class="card grp"><summary>${s} <span class="mu">${x.length} belum klik · target ${rp(sum(x,0))}</span></summary>${hs.map(d=>`<div class="hh">${d} · ${so(d).length}</div><ol class="ol">${so(d).map(o=>`<li>${esc(o.nm)} <span class="mu">${o.rs} · ${rp(o.k[0])}</span></li>`).join("")}</ol>`).join("")}<div style="margin-top:10px"><button class="btn cp" data-s="${esc(s)}">Salin daftar ${esc(s.split(" ")[0])}</button></div></details>`}).join("");
  h+=`<textarea id="cpt" aria-label="Teks salinan" style="position:absolute;left:-9999px" readonly></textarea>`;
  return h;
}

const R={ring,sf:sfTab,hari,kec:kecTab,km:kmTab,out:outTab,tem};
if(!R[st.tab])st.tab="ring";
function draw(){setProd(st.prod);$("sub").innerHTML=L.sub;document.querySelectorAll("#prod button").forEach(b=>b.classList.toggle("on",b.dataset.v===st.prod));$("fkec").value=st.kec;$("fsf").value=st.sf;$("fpjp").value=st.pjp;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===st.tab));
  $("P").innerHTML=R[st.tab]();
  if(st.tab==="km")document.querySelectorAll("#kmsel button").forEach(b=>b.onclick=()=>{st.km=b.dataset.v;draw()});
  if(st.tab==="byu"||st.tab==="km")document.querySelectorAll(".cp").forEach(b=>b.onclick=e=>{e.preventDefault();const t=BY[b.dataset.s],ok=()=>{$("cpm").textContent="· Daftar "+b.dataset.s+" disalin"};
    const fb=()=>{const ta=$("cpt");ta.value=t;ta.style.left="0";ta.select();try{document.execCommand("copy");ok()}catch(_){$("cpm").textContent="· Salin gagal, pilih teks manual"}ta.style.left="-9999px"};
    try{navigator.clipboard.writeText(t).then(ok,fb)}catch(_){fb()}});
  if(st.tab==="out"){$("ost").value=st.ost;$("q").oninput=e=>{st.q=e.target.value;st.pg=0;const p=e.target.selectionStart;draw();$("q").focus();$("q").setSelectionRange(p,p)};
    $("ost").onchange=e=>{st.ost=e.target.value;st.pg=0;draw()};
    document.querySelectorAll("th.s").forEach(t=>t.onclick=()=>{st.sort=t.dataset.s;draw()});
    $("prv").onclick=()=>{st.pg--;draw()};$("nxt").onclick=()=>{st.pg++;draw()}}
  save()}
["kec","sf","pjp"].forEach(k=>$("f"+k).onchange=e=>{st[k]=e.target.value;st.pg=0;draw()});
document.querySelectorAll("#prod button").forEach(b=>b.onclick=()=>{st.prod=b.dataset.v;st.pg=0;draw()});
$("reset").onclick=()=>{st.kec=st.sf=st.pjp="";draw()};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;draw()});
const TABN={ring:"Ringkasan",sf:"Per SF",hari:"SF × Hari",kec:"Kecamatan",byu:"Belum OA By.U",km:"Klik Misi",out:"Outlet",tem:"Temuan"};
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(d.getHours())}.${p(d.getMinutes())}`}
async function shot(){
  if(!window.html2canvas)throw new Error("lib");
  const c=$("cap"),flt=[st.kec,st.sf,st.pjp].filter(Boolean).join(" · ")||"Semua kecamatan, SF, dan hari";
  c.innerHTML=`<div class="ch"><div><h1>${st.tab==="km"?(st.km==="b"?"Klik Misi By.U":"Klik Misi Reguler"):"Dashboard "+st.prod} Outlet TAP Bagan Batu</h1><div class="sub">${TABN[st.tab]} · ${esc(flt)}</div>${st.tab==="km"?"":`<div class="sub">${L.sub}</div>`}</div><div class="sub" style="text-align:right">Dibuat ${stamp()}</div></div>`+$("P").innerHTML;
  const bg=getComputedStyle(document.body).backgroundColor;
  try{return await html2canvas(c,{scale:2,backgroundColor:bg,logging:false,windowWidth:1000})}
  finally{c.innerHTML=""}
}
const toBlob=(cv,t,q)=>new Promise((r,j)=>cv.toBlob(b=>b?r(b):j(new Error("blob")),t,q));
const msg=t=>{$("cpst").textContent=t};
let dl=null;try{claude.use("downloads").then(x=>{dl=x;if(!x)$("jpg").hidden=true}).catch(()=>{$("jpg").hidden=true})}catch(e){$("jpg").hidden=true}
$("jpg").onclick=async()=>{if(!dl){msg("Simpan file tidak tersedia di tampilan ini");return}
  msg("Membuat gambar…");try{const cv=await shot();const b=await toBlob(cv,"image/jpeg",.92);
  const nm=`${st.tab==="km"?(st.km==="b"?"By.U":"Reguler"):st.prod} BBT ${TABN[st.tab]}${st.sf?" "+st.sf:""}${st.pjp?" "+st.pjp:""}${st.kec?" "+st.kec:""} ${stamp()}.jpg`.replace(/[\/\\:×]/g,"-");
  await dl.save({filename:nm,data:b});msg("Gambar disimpan")}catch(e){msg(e&&e.code==="declined"?"Dibatalkan":e&&e.message==="lib"?"Pustaka gambar gagal dimuat, muat ulang halaman":"Gagal membuat gambar")}};
$("cimg").onclick=()=>{msg("Membuat gambar…");
  try{const p=shot().then(cv=>toBlob(cv,"image/png"));
    navigator.clipboard.write([new ClipboardItem({"image/png":p})]).then(()=>msg("Gambar disalin, tinggal tempel di WhatsApp"),()=>msg("Browser ini tidak mengizinkan salin gambar. Pakai Simpan JPEG"))}
  catch(e){msg("Browser ini tidak mengizinkan salin gambar. Pakai Simpan JPEG")}};
/* ===== Upload data (diolah di browser, tanpa AI) ===== */
const SUB0={VF:PR.VF.sub,SA:PR.SA.sub},K0=D.K,BASE=O.map(o=>[o.vr,o.vb,o.ss,o.sb]);
let OV={};
const numv=v=>{if(typeof v==="number")return Math.round(v);v=String(v??"").trim();if(!v||v==="-")return 0;const n=parseInt(v.replace(/[.\s]/g,"").replace(/,.*/,""),10);return isNaN(n)?0:n};
const idv=v=>typeof v==="number"?String(Math.round(v)):String(v??"").trim();
const hnorm=s=>String(s??"").trim().toLowerCase();
function applyOV(){
  O.forEach((o,i)=>{const b=BASE[i];
    o.vr=OV.vf?(OV.vf.d[o.id]||[0,0])[0]:b[0];o.vb=OV.vf?(OV.vf.d[o.id]||[0,0])[1]:b[1];
    o.ss=OV.sa?(OV.sa.d[o.id]||[0,0])[0]:b[2];o.sb=OV.sa?(OV.sa.d[o.id]||[0,0])[1]:b[3]});
  D.K=OV.km?OV.km.d:K0;
  PR.VF.sub=OV.vf?SUB0.VF.replace(/update [^·]*·/,`update ${OV.vf.dt} ·`):SUB0.VF;
  PR.SA.sub=OV.sa?SUB0.SA.replace(/update [^·]*·/,`update ${OV.sa.dt} ·`):SUB0.SA;
  const parts=[["vf","VF"],["sa","SA"],["km","Klik Misi"]].filter(([k])=>OV[k]).map(([k,n])=>`${n} (${OV[k].dt})`);
  $("upbar").hidden=!parts.length;$("upinfo").textContent=parts.length?`Memakai data upload kamu: ${parts.join(", ")}. Hanya tersimpan di browser ini; orang lain yang membuka link tetap melihat data terakhir yang dipublish.`:"";
}
function findDate(rows){for(const r of rows.slice(0,8))for(const c of r){const m=String(c??"").match(/update tanggal\s+(.+)/i);if(m)return m[1].trim()}return null}
function stamp2(){const d=new Date();return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}
function parseSheet(rows,fname){
  const hi=rows.findIndex((r,i)=>i<10&&r.some(c=>/^(id outlet|outlet id|id_outlet)$/.test(hnorm(c))));
  if(hi<0)return null;
  const H=rows[hi].map(hnorm),col=n=>H.indexOf(n),idc=H.findIndex(h=>/^(id outlet|outlet id|id_outlet)$/.test(h));
  const ids=new Set(O.map(o=>o.id)),data=rows.slice(hi+1).filter(r=>/^\d{8,}$/.test(idv(r[idc])));
  const dt=findDate(rows)||stamp2();
  if(col("st vf reg")>=0){const d={};let m=0;data.forEach(r=>{const id=idv(r[idc]);if(ids.has(id)){d[id]=[numv(r[col("st vf reg")]),numv(r[col("st vf by.u")])];m++}});return{k:"vf",n:"VF",v:{d,dt},m}}
  if(col("st sa simp")>=0){const d={};let m=0;data.forEach(r=>{const id=idv(r[idc]);if(ids.has(id)){d[id]=[numv(r[col("st sa simp")]),numv(r[col("st sa by.u")])];m++}});return{k:"sa",n:"SA",v:{d,dt},m}}
  const tf=col("target fix");
  if(tf>=0){const ach=H.indexOf("ach",tf),kl=col("klik misi"),rr=col("runrate");
    const isR=col("status")>=0,st_=col("status"),ra=col("rata-rata"),su=col("kandidat misi sultan"),kp=col("keterengan program")>=0?col("keterengan program"):col("keterangan program");
    const d={};let m=0;data.forEach(r=>{const id=idv(r[idc]);if(!ids.has(id))return;m++;
      d[id]=isR?[numv(r[tf]),numv(r[ach]),numv(r[kl]),numv(r[rr]),String(r[st_]??""),numv(r[ra]),r[su]&&r[su]!=="NON PROGRAM"?String(r[su]):""]:[numv(r[tf]),numv(r[ach]),numv(r[kl]),numv(r[rr]),String(r[kp]??"")]});
    return{k:isR?"kmr":"kmb",n:isR?"Klik Misi Reguler":"Klik Misi By.U",v:d,m}}
  return null;
}
async function readFile(file){
  const buf=await file.arrayBuffer(),isText=/\.(csv|txt)$/i.test(file.name);
  const wb=isText?XLSX.read(new TextDecoder("utf-8").decode(buf),{type:"string",raw:true}):XLSX.read(buf,{type:"array"});
  return wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}));
}
async function handleFiles(files){
  if(!window.XLSX){msg("Pustaka pembaca file gagal dimuat, muat ulang halaman");return}
  msg("Membaca file…");const got=[];let km=null;
  try{for(const fl of files){for(const rows of await readFile(fl)){const r=parseSheet(rows,fl.name);if(!r)continue;
      if(r.k==="kmr"||r.k==="kmb"){km=km||{};km[r.k]=r.v;got.push(`${r.n}: ${r.m} outlet`)}else{OV[r.k]=r.v;got.push(`${r.n}: ${r.m} outlet cocok`)}}}
    if(km){const d={};for(const t of["kmr","kmb"])if(km[t])for(const id in km[t])(d[id]=d[id]||{})[t==="kmr"?"r":"b"]=km[t][id];
      if(!km.kmr||!km.kmb){const old=OV.km?OV.km.d:K0;for(const id in old){const keep=km.kmr?"b":"r";if(old[id][keep])(d[id]=d[id]||{})[keep]=old[id][keep]}}
      OV.km={d,dt:stamp2()}}
    if(!got.length){msg("Format file tidak dikenali. Pakai file VF, SA, atau Klik Misi dengan kolom yang sama seperti biasa.");return}
    try{OV._v=D.VER;localStorage.setItem("vfbbt_up",JSON.stringify(OV))}catch(e){}
    applyOV();draw();msg("Diperbarui · "+got.join(" · "));
  }catch(e){msg("Gagal membaca file: "+(e&&e.message||e))}
}
$("upbtn").onclick=()=>$("upf").click();
(function(){const de=document.documentElement,b=$("fsbtn"),isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const req=de.requestFullscreen||de.webkitRequestFullscreen,ex=document.exitFullscreen||document.webkitExitFullscreen;
  const sync=()=>{const on=isFs()||de.classList.contains("fs-lite");de.classList.toggle("fs",on);b.textContent=on?"Keluar layar penuh":"Layar penuh"};
  de.classList.add("fs-lite");sync();
  const auto=e=>{document.removeEventListener("pointerdown",auto,true);if(e.target===b||isFs()||!req)return;try{const p=req.call(de);if(p&&p.catch)p.catch(()=>{})}catch(_){}};
  document.addEventListener("pointerdown",auto,true);
  document.addEventListener("fullscreenchange",sync);document.addEventListener("webkitfullscreenchange",sync);
  b.onclick=()=>{if(isFs()){try{ex.call(document)}catch(e){}return}
    if(de.classList.contains("fs-lite")){de.classList.remove("fs-lite");sync();return}
    const lite=()=>{de.classList.add("fs-lite");sync();msg("Layar penuh browser tidak tersedia di sini, tampilan dilebarkan saja")};
    try{const p=req&&req.call(de);if(p&&p.catch)p.catch(lite);else if(!req)lite()}catch(e){lite()}};
})();
$("upf").onchange=e=>{const fs=[...e.target.files];e.target.value="";if(fs.length)handleFiles(fs)};
$("upreset").onclick=()=>{OV={};try{localStorage.removeItem("vfbbt_up")}catch(e){}applyOV();draw();msg("Kembali ke data yang dipublish")};
try{const s=JSON.parse(localStorage.getItem("vfbbt_up")||"null");if(s&&s._v===D.VER)OV=s;else if(s)localStorage.removeItem("vfbbt_up")}catch(e){}
applyOV();
draw();
