<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalkulator Jualan</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0f14"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mu:#5b6b85;--bd:#e3e8f0;--soft:#eef2f8;--ac:#c8102e;--ok:#0f8a52}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f14;--card:#171b25;--tx:#eef1f6;--mu:#98a2b6;--bd:#283041;--soft:#1f2533;--ok:#4cd38f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 170px}
.w{max-width:640px;margin:0 auto}h1{font-size:22px;margin:6px 60px 4px 0}.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 8px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}
input{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
.btn{padding:10px 15px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer}.btn.s{background:var(--soft);color:var(--tx);border:1px solid var(--bd);font-size:13px;padding:8px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.it{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--bd);align-items:center}.it:first-child{border-top:0}
.it .nm{font-weight:600;font-size:14.5px}.it .hp{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mu);margin-top:3px}.it .hp input{width:96px;padding:5px 8px;font-size:13px}
.st{display:flex;align-items:center;gap:4px}.st button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font-size:18px;font-weight:700;cursor:pointer}.st input{width:64px;text-align:center;padding:7px 4px;font-weight:700}
.it .sb{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu)}.it .sb b{color:var(--tx)}
.it.on{background:linear-gradient(90deg,rgba(200,16,46,.06),transparent)}
.qk{display:flex;gap:4px}.qk button{border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer}
.tot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.tot .in{max-width:640px;margin:0 auto}.tot .r{display:flex;justify-content:space-between;align-items:baseline}.tot .big{font-size:24px;font-weight:800}.tot small{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.h{border-top:1px solid var(--bd);padding:8px 0;font-size:13px}.h:first-child{border-top:0}
</style></head><body><div class="w">
<h1>Kalkulator Jualan</h1><div class="sub">Isi jumlah per produk, harga bisa diubah. Total, bayar, dan kembalian otomatis. Produk & harga sama dengan daftar di Penyusun WL.</div>
<div class="card"><div class="g2"><div><label>Nama outlet / pembeli</label><input id="on" placeholder="mis. Toko A"></div><div><label>Cari produk</label><input id="q" placeholder="ketik VF / SA…"></div></div></div>
<div class="card"><div id="list"></div>
  <div class="row" style="margin-top:10px"><input id="nn" placeholder="Produk lain (nama)" style="flex:2;min-width:140px"><input id="nh" inputmode="numeric" placeholder="Harga" style="flex:1;min-width:90px"><button class="btn s" id="na">＋ Tambah</button></div>
</div>
<div class="card"><h2>Pembayaran</h2><div class="g2"><div><label>Diskon (Rp)</label><input id="ds" inputmode="numeric" placeholder="0"></div><div><label>Bayar (Rp)</label><input id="by" inputmode="numeric" placeholder="0"></div></div>
  <div class="row" style="margin-top:8px" id="byq"></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Total jualan</h2><input type="date" id="tg" style="width:auto;padding:6px 8px;font-size:13px"></div><div id="rk" style="margin-top:8px"></div></div>
<div class="card"><h2>Riwayat nota</h2><div id="hist"></div></div>
</div>
<div class="tot"><div class="in">
  <div class="r"><small id="tq">0 pcs</small><span class="big" id="tt">Rp 0</span></div>
  <div class="r" style="margin-top:2px"><small id="kb"></small><small id="dsx"></small></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="cp" style="flex:1">Salin nota WA</button><button class="btn s" id="sv">💾 Simpan</button><button class="btn s" id="rs">Reset</button></div>
</div></div>
<script>
const $=i=>document.getElementById(i),nf=v=>Math.round(v).toLocaleString('id-ID'),rp=v=>'Rp '+nf(v),num=v=>parseInt(String(v||'').replace(/\D/g,'')||'0',10),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P0=['VF 7GB/24 jam','VF 7GB/2 hari','VF 7GB/3 hari','VF 7GB/5 hari','VF 11GB/5 hari','VF 7GB/7 hari','SA 3GB','SA 5GB','SA 7GB','SA 10GB','SA 15GB','SA BYU 3GB','SA BYU 5GB'].map(n=>({n,h:0}));
let PL;try{PL=JSON.parse(localStorage.getItem('wlp')||'null')}catch(e){}if(!Array.isArray(PL)||!PL.length)PL=P0;
let S={on:'',it:{},ex:[],ds:0,by:0};try{const x=JSON.parse(localStorage.getItem('kalk')||'null');if(x)S=Object.assign(S,x)}catch(e){}
let HL;try{HL=JSON.parse(localStorage.getItem('kalkh')||'[]')}catch(e){HL=[]}if(!Array.isArray(HL))HL=[];
const save=()=>{try{localStorage.setItem('kalk',JSON.stringify(S))}catch(e){}};
const prods=()=>[...PL.map(p=>({n:p.n,h0:p.h||0})),...S.ex.map(p=>({n:p.n,h0:p.h,ex:1}))];
const line=n=>S.it[n]||(S.it[n]={q:0,h:null});
const price=p=>{const l=S.it[p.n];return l&&l.h!=null?l.h:p.h0};
function rows(){return prods().map(p=>({...p,q:(S.it[p.n]||{}).q||0,h:price(p)})).filter(x=>x.q>0)}
function draw(){const k=$('q').value.trim().toLowerCase();
  $('list').innerHTML=prods().filter(p=>!k||p.n.toLowerCase().includes(k)).map(p=>{const q=(S.it[p.n]||{}).q||0,h=price(p);
    return `<div class="it${q?' on':''}" data-n="${esc(p.n)}"><div><div class="nm">${esc(p.n)}</div><div class="hp">@ <input data-h inputmode="numeric" value="${h?nf(h):''}" placeholder="harga">${p.ex?' <a href="#" data-dx style="color:var(--ac);margin-left:4px">hapus</a>':''}</div></div>
      <div class="st"><button data-d="-1">−</button><input data-q inputmode="numeric" value="${q||''}" placeholder="0"><button data-d="1">+</button></div>
      <div class="sb"><span class="qk">${[10,50,100].map(v=>`<button data-a="${v}">+${v}</button>`).join('')}</span><span>${q?`<b>${rp(q*h)}</b>`:''}</span></div></div>`}).join('')||'<div class="sub">Produk tidak ditemukan.</div>';tot()}
function tot(){const R=rows(),q=R.reduce((s,x)=>s+x.q,0),sub=R.reduce((s,x)=>s+x.q*x.h,0),t=Math.max(0,sub-S.ds);
  $('tq').textContent=`${nf(q)} pcs · ${R.length} produk`;$('tt').textContent=rp(t);$('dsx').textContent=S.ds?`subtotal ${rp(sub)} − diskon ${rp(S.ds)}`:'';
  $('kb').innerHTML=S.by?(S.by>=t?`Kembali <b style="color:var(--ok)">${rp(S.by-t)}</b>`:`Kurang <b style="color:var(--ac)">${rp(t-S.by)}</b>`):'';
  const r=[t,Math.ceil(t/50000)*50000,Math.ceil(t/100000)*100000,Math.ceil(t/500000)*500000].filter((v,i,a)=>v>0&&a.indexOf(v)===i);
  $('byq').innerHTML=t?`<button class="btn s" data-by="${t}">Uang pas</button>`+r.slice(1).map(v=>`<button class="btn s" data-by="${v}">${rp(v)}</button>`).join(''):'';save();return{R,q,sub,t}}
function upd(el){const it=el.closest('.it');if(!it)return;const n=it.dataset.n,l=line(n),q=l.q||0;it.classList.toggle('on',q>0);it.querySelector('[data-q]').value=q||'';const p=prods().find(x=>x.n===n);it.querySelector('.sb span:last-child').innerHTML=q?`<b>${rp(q*price(p))}</b>`:'';tot()}
document.addEventListener('click',e=>{const t=e.target,d=t.dataset||{},it=t.closest('.it');
  if(it&&d.d){e.preventDefault();const l=line(it.dataset.n);l.q=Math.max(0,(l.q||0)+(+d.d));upd(t)}
  if(it&&d.a){e.preventDefault();const l=line(it.dataset.n);l.q=(l.q||0)+(+d.a);upd(t)}
  if(it&&d.dx!==undefined){e.preventDefault();const n=it.dataset.n;S.ex=S.ex.filter(x=>x.n!==n);delete S.it[n];draw()}
  if(d.by){$('by').value=nf(+d.by);S.by=+d.by;tot()}
  if(t.id==='na'){const n=$('nn').value.trim();if(!n){$('nn').focus();return}if(!prods().some(p=>p.n===n))S.ex.push({n,h:num($('nh').value)});$('nn').value='';$('nh').value='';draw()}
  if(t.id==='cp'){copy(nota(),t)}
  if(t.id==='sv'){const x=tot();if(!x.R.length){alert('Belum ada produk.');return}HL.unshift({t:Date.now(),on:S.on,R:x.R.map(r=>({n:r.n,q:r.q,h:r.h})),ds:S.ds,by:S.by,tt:x.t});HL=HL.slice(0,100);try{localStorage.setItem('kalkh',JSON.stringify(HL))}catch(_){}drawH();t.textContent='Tersimpan ✓';setTimeout(()=>t.textContent='💾 Simpan',1500)}
  if(t.id==='rs'&&confirm('Kosongkan semua jumlah?')){S.it={};S.ds=0;S.by=0;S.on='';$('on').value='';$('ds').value='';$('by').value='';draw()}
  if(d.ho!==undefined){const h=HL[+d.ho];S.on=h.on;S.ds=h.ds;S.by=h.by;S.it={};h.R.forEach(r=>{if(!prods().some(p=>p.n===r.n))S.ex.push({n:r.n,h:r.h});S.it[r.n]={q:r.q,h:r.h}});$('on').value=S.on||'';$('ds').value=S.ds?nf(S.ds):'';$('by').value=S.by?nf(S.by):'';draw();scrollTo({top:0,behavior:'smooth'})}
  if(d.hc!==undefined)copy(nota(HL[+d.hc]),t);
  if(t.id==='cpd')copy(rekapD(),t);
  if(d.hx!==undefined&&confirm('Hapus nota ini?')){HL.splice(+d.hx,1);try{localStorage.setItem('kalkh',JSON.stringify(HL))}catch(_){}drawH()}});
document.addEventListener('input',e=>{const t=e.target,it=t.closest('.it');
  if(it&&t.dataset.q!==undefined){line(it.dataset.n).q=num(t.value);const c=t.selectionStart;upd(t);try{t.setSelectionRange(c,c)}catch(_){}}
  if(it&&t.dataset.h!==undefined){const v=num(t.value);line(it.dataset.n).h=v;const o=v?nf(v):'';if(t.value!==o)t.value=o;upd(t)}
  if(['ds','by','nh'].includes(t.id)){const v=num(t.value),o=v?nf(v):'';if(t.value!==o)t.value=o;if(t.id!=='nh'){S[t.id]=v;tot()}}
  if(t.id==='on'){S.on=t.value;save()}if(t.id==='q')draw();if(t.id==='tg')drawD()});
const tglF=t=>{const d=new Date(t);return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})+' '+d.toTimeString().slice(0,5)};
function nota(h){const x=h?{R:h.R,q:h.R.reduce((s,r)=>s+r.q,0),sub:h.R.reduce((s,r)=>s+r.q*r.h,0),t:h.tt}:tot(),on=h?h.on:S.on,ds=h?h.ds:S.ds,by=h?h.by:S.by;
  return `*NOTA${on?' – '+on:''}*\n${tglF(h?h.t:Date.now())}\n\n`+x.R.map(r=>`${r.n}\n${nf(r.q)} × ${rp(r.h)} = ${rp(r.q*r.h)}`).join('\n\n')+`\n\n*Total jualan: ${nf(x.q)} pcs · ${rp(x.sub)}*`+grp(x.R)+(ds?`\nDiskon: ${rp(ds)}`:'')+`\n*Total bayar: ${rp(x.t)}*`+(by?`\nBayar: ${rp(by)}\n${by>=x.t?'Kembali: '+rp(by-x.t):'Kurang: '+rp(x.t-by)}`:'')}
function grp(R){const G={};R.forEach(r=>{const k=/^SA\b/i.test(r.n)?'SA':/^VF\b/i.test(r.n)?'VF':'Lainnya';(G[k]=G[k]||[0,0]);G[k][0]+=r.q;G[k][1]+=r.q*r.h});const K=Object.keys(G);return K.length>1?K.map(k=>`\n${k}: ${nf(G[k][0])} pcs · ${rp(G[k][1])}`).join(''):''}
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function day(){const k=$('tg').value||dk(Date.now()),H=HL.filter(h=>dk(h.t)===k),P={};let q=0,sub=0,tt=0,ds=0;
  H.forEach(h=>{h.R.forEach(r=>{(P[r.n]=P[r.n]||[0,0]);P[r.n][0]+=r.q;P[r.n][1]+=r.q*r.h;q+=r.q;sub+=r.q*r.h});ds+=h.ds||0;tt+=h.tt});return{k,H,P,q,sub,tt,ds}}
function drawD(){const x=day(),lab=x.k===dk(Date.now())?'Hari ini':new Date(x.k+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'});
  $('rk').innerHTML=x.H.length?`<div style="font-size:13px;color:var(--mu)">${lab} · ${x.H.length} nota</div><div style="font-size:22px;font-weight:800;margin:2px 0">${rp(x.tt)}</div><div style="font-size:13px;color:var(--mu)">${nf(x.q)} pcs${x.ds?' · diskon '+rp(x.ds):''}</div>
    <div style="margin-top:8px">${Object.entries(x.P).sort((a,b)=>b[1][1]-a[1][1]).map(([n,v])=>`<div class="row" style="justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid var(--bd)"><span>${esc(n)}</span><span>${nf(v[0])} pcs · <b>${rp(v[1])}</b></span></div>`).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="btn s" id="cpd">Salin rekap ${lab.toLowerCase()}</button></div>`:`<div class="sub" style="margin:0">${lab}: belum ada nota tersimpan. Ketuk 💾 Simpan setelah tiap transaksi supaya masuk ke total jualan.</div>`}
function rekapD(){const x=day(),d=new Date(x.k+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return `*Total jualan ${d}*\n${x.H.length} nota · ${nf(x.q)} pcs\n\n`+Object.entries(x.P).sort((a,b)=>b[1][1]-a[1][1]).map(([n,v])=>`${n}: ${nf(v[0])} pcs · ${rp(v[1])}`).join('\n')+(g=>g?'\n'+g:'')(grp(Object.entries(x.P).map(([n,v])=>({n,q:v[0],h:v[0]?v[1]/v[0]:0}))))+`\n\nPer outlet:\n`+x.H.slice().reverse().map((h,i)=>`${i+1}. ${h.on||'(tanpa nama)'}: ${nf(h.R.reduce((s,r)=>s+r.q,0))} pcs · ${rp(h.tt)}`).join('\n')+(x.ds?`\n\nTotal diskon: ${rp(x.ds)}`:'')+`\n\n*Total jualan: ${rp(x.tt)}*`}
function drawH(){drawD();$('hist').innerHTML=HL.length?HL.slice(0,30).map((h,i)=>`<div class="h"><div class="row" style="justify-content:space-between"><b>${esc(h.on||'(tanpa nama)')}</b><span style="color:var(--mu);font-size:12px">${tglF(h.t)}</span></div><div style="color:var(--mu);margin:2px 0 6px">${nf(h.R.reduce((s,r)=>s+r.q,0))} pcs · <b style="color:var(--tx)">${rp(h.tt)}</b> · ${esc(h.R.map(r=>r.n).join(', ').slice(0,80))}</div><div class="row"><button class="btn s" data-ho="${i}">Buka</button><button class="btn s" data-hc="${i}">Salin</button><button class="btn s" data-hx="${i}" style="color:var(--ac)">Hapus</button></div></div>`).join(''):'<div class="sub" style="margin:0">Belum ada nota tersimpan.</div>'}
async function copy(t,btn){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}if(btn){const o=btn.textContent;btn.textContent='Tersalin ✓';setTimeout(()=>btn.textContent=o,1500)}}
$('on').value=S.on||'';$('ds').value=S.ds?nf(S.ds):'';$('by').value=S.by?nf(S.by):'';$('tg').value=dk(Date.now());draw();drawH();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script><script src="nav.js"></script></body></html>
